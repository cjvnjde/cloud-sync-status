<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Sync Status example</title>
  <desc id="desc">An icon-only top bar and a detailed popup showing an example cloud's sync progress. All values are example data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211d36"/><stop offset="1" stop-color="#111520"/></linearGradient>
    <g id="cloud" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 17h12a5 5 0 0 0 .7-9.9A7 7 0 0 0 5.5 8.6 4.3 4.3 0 0 0 6 17Z"/>
    </g>
  </defs>
  <rect width="760" height="490" rx="14" fill="url(#bg)"/>
  <rect x="20" y="20" width="720" height="32" rx="6" fill="#252335" stroke="#45415c"/>
  <g fill="#9f9ab4" font-family="monospace" font-size="11"><text x="35" y="41">1  2  3</text><text x="331" y="41">Omarchy</text></g>
  <use href="#cloud" x="680" y="23" color="#91b4fa"/>
  <path d="M690 57 684 64H696Z" fill="#91b4fa"/>
  <rect x="350" y="65" width="390" height="400" rx="8" fill="#1d1e2c" stroke="#91b4fa" stroke-width="1.4"/>
  <g font-family="monospace" font-size="12">
    <text x="370" y="92" fill="#e1def1" font-size="15" font-weight="bold">Cloud sync</text>
    <text x="370" y="113" fill="#9690aa" font-size="10">1 cloud job · 1 syncing</text>
    <rect x="367" y="128" width="356" height="307" rx="6" fill="#242433" stroke="#3d3a50"/>
    <circle cx="383" cy="150" r="3.5" fill="#91b4fa"/>
    <text x="395" y="154" fill="#e1def1" font-weight="bold">Google Drive · work</text>
    <text x="382" y="178" fill="#91b4fa">Syncing</text>
    <text x="382" y="199" fill="#d4cfe5">~/Cloud/Work</text>
    <text x="382" y="217" fill="#9690aa" font-size="10">work:Documents · two-way sync</text>
    <g fill="#9690aa" font-size="10"><text x="382" y="245">Files transferred</text><text x="565" y="245">Queued + active</text></g>
    <g fill="#e1def1"><text x="382" y="264">124</text><text x="565" y="264">38</text></g>
    <g fill="#9690aa" font-size="10"><text x="382" y="290">Transferred</text><text x="565" y="290">Reported speed</text></g>
    <g fill="#e1def1"><text x="382" y="309">246.8 MiB</text><text x="565" y="309">4.2 MiB/s</text></g>
    <text x="382" y="336" fill="#9690aa" font-size="10">Transferring now</text>
    <text x="382" y="357" fill="#d4cfe5" font-size="10">Documents/report.pdf</text><text x="677" y="357" fill="#9690aa" font-size="10">67%</text>
    <rect x="382" y="365" width="324" height="2" fill="#464357"/><rect x="382" y="365" width="217" height="2" fill="#91b4fa"/>
    <text x="382" y="392" fill="#9690aa" font-size="10">Queue refills as files finish.</text><text x="382" y="409" fill="#9690aa" font-size="10">Counts describe queued work.</text>
  </g>
  <g font-family="monospace"><text x="38" y="188" fill="#e1def1" font-size="24" font-weight="bold">Cloud sync,</text><text x="38" y="222" fill="#e1def1" font-size="24" font-weight="bold">at a glance.</text><text x="38" y="264" fill="#aaa3bf" font-size="13">One icon in the bar.</text><text x="38" y="289" fill="#aaa3bf" font-size="13">Details when you need them.</text><text x="38" y="444" fill="#827b96" font-size="10">Illustrated preview · example data</text></g>
</svg>
